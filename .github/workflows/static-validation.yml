name: Static validation

on:
  push:
    branches: [main, "improve/**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File
          if (-not $files) { throw "No PowerShell scripts found." }
          $errors = @()
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors
            )
            foreach ($errorItem in $parseErrors) {
              $errors += "$($file.FullName): $($errorItem.Message)"
            }
          }
          if ($errors.Count) { $errors | Write-Error; exit 1 }
          Write-Host "Parsed $($files.Count) PowerShell files successfully."

      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File
          if (-not $files) { throw "No PowerShell scripts found." }
          $errors = @()
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors
            )
            foreach ($errorItem in $parseErrors) {
              $errors += "$($file.FullName): $($errorItem.Message)"
            }
          }
          if ($errors.Count) { $errors | Write-Error; exit 1 }
          Write-Host "Parsed $($files.Count) PowerShell files with Windows PowerShell 5.1."

      - name: Compile Python scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.py -Recurse -File
          foreach ($file in $files) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Python compilation failed: $($file.FullName)" }
          }

      - name: Verify network report path
        shell: pwsh
        run: |
          $batch = Get-Content "05-Utilities/QuickNetworkCheck.bat" -Raw
          if ($batch -notmatch '(?m)^set "REPORTDIR=%~dp0\.\.\\Reports"\r?$') {
            throw "QuickNetworkCheck.bat report directory must resolve to repository-root Reports."
          }
